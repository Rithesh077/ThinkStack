<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThinkStack — starting…</title>
  <!--
    Paper and Ink, hand-inlined.

    This is the first surface a user ever sees: Tauri embeds it from public/ and
    shows it before the backend is up and before React exists, then navigates to
    127.0.0.1:8000. It sat on the old acid-green-on-black theme long after the
    app itself had stopped, so every launch opened on a screen from a different
    product.

    Two things it cannot have, and both are why the values below are literals
    rather than tokens. It never loads index.css, so there are no custom
    properties here. And it runs before dist/assets exists, so it cannot reach
    the bundled woff2 either -- the type is Georgia and the system stack, which
    is exactly the fallback chain --serif and --sans name.

    Only the stylesheet changed. Every line of the script below is untouched:
    the IPv4 note, the replay of steps that happened before the webview
    attached, and the bounded poll are all still right.
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.1rem; padding: 2rem;
      background: #EBE6DA;              /* the desk */
      color: #191712;                   /* ink */
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none; user-select: none;
      overflow: hidden;
    }
    /* the wordmark reads, so it is set in the serif at one weight. The old one
       was 800-weight sans with a 22px green glow behind half of it. */
    .brand {
      font-family: Newsreader, Georgia, "Times New Roman", serif;
      font-size: 2.4rem; font-weight: 400; letter-spacing: -0.018em;
    }
    .brand .stack { color: #191712; }

    /* One thin ink ring. It is the only moving thing on the screen and it is
       saying "still working", which is the entire job. */
    .ring {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid rgba(25,23,18,0.16); border-top-color: #575043;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* stopped means failed, and failure is the one thing that gets the red pen */
    .ring.stopped { animation: none; border-color: rgba(166,57,42,0.28); border-top-color: #A6392A; }

    .msg { font-size: 0.95rem; color: #575043; min-height: 1.2em; text-align: center; }
    .sub { font-size: 0.72rem; color: #6B6455; font-variant-numeric: tabular-nums; }

    /* the diagnostic trail -- what the app is actually doing, as it does it.
       A sheet lying on the desk, with the app's one shadow under it. */
    .log {
      width: min(760px, 100%); height: 190px;
      margin-top: 0.4rem; padding: 0.75rem 0.9rem;
      background: #FBF8F1;
      border: 1px solid rgba(25,23,18,0.13); border-radius: 2px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.75),
        0 1px 1px rgba(25,23,18,0.05),
        0 14px 30px -20px rgba(25,23,18,0.42);
      overflow-y: auto; overscroll-behavior: contain;
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.72rem; line-height: 1.55; color: #6B6455;
      -webkit-user-select: text; user-select: text;
    }
    .log .line { white-space: pre-wrap; word-break: break-word; }
    .log .t { color: #B9B2A2; }        /* the elapsed stamp, quietest thing here */
    .log .phase { color: #191712; }    /* was the acid green; the phase is just ink */
    .log .err { color: #A6392A; }

    .fail {
      display: none; width: min(760px, 100%);
      padding: 0.85rem 1rem; border-radius: 2px;
      background: rgba(166,57,42,0.06); border: 1px solid rgba(166,57,42,0.34);
      font-size: 0.85rem; color: #A6392A; -webkit-user-select: text; user-select: text;
    }
    .fail code {
      display: block; margin-top: 0.5rem; font-size: 0.7rem; color: #6B6455;
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      word-break: break-all;
    }
    .actions { display: none; gap: 0.6rem; }
    /* Retry is the primary action on a screen with nothing else to press, so
       it is the app's primary button: solid ink, paper text. */
    button {
      font: inherit; font-size: 0.8rem; padding: 0.5rem 1.1rem; border-radius: 2px;
      background: #191712; color: #FBF8F1;
      border: 1px solid #191712; cursor: pointer;
    }
    button:hover { background: #575043; border-color: #575043; }
    button:focus-visible { outline: 2px solid #A6392A; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
  </style>
</head>
<body>
  <div class="brand">Think<span class="stack">Stack</span></div>
  <div class="ring" id="ring"></div>
  <div class="msg" id="msg">Starting…</div>
  <div class="sub" id="sub">0s elapsed</div>

  <div class="log" id="log"></div>

  <div class="fail" id="fail">
    <div id="failMsg"></div>
    <code id="failPath"></code>
  </div>
  <div class="actions" id="actions">
    <button id="retry">Retry</button>
  </div>

  <script>
    // The backend binds 127.0.0.1 (IPv4). Do NOT use "localhost": it resolves to
    // ::1 first on most modern Linux and macOS systems, and a webview that does
    // not fall back to IPv4 gets connection-refused forever against a backend
    // that is up and healthy.
    var BACKEND = 'http://127.0.0.1:8000/';
    var START = Date.now();
    var done = false;

    var msgEl = document.getElementById('msg');
    var subEl = document.getElementById('sub');
    var logEl = document.getElementById('log');
    var ringEl = document.getElementById('ring');

    function secs() { return Math.round((Date.now() - START) / 1000); }

    setInterval(function () {
      if (!done) subEl.textContent = secs() + 's elapsed';
    }, 1000);

    function log(phase, text, cls) {
      var line = document.createElement('div');
      line.className = 'line';
      line.innerHTML =
        '<span class="t">' + String(secs()).padStart(3, ' ') + 's </span>' +
        '<span class="' + (cls || 'phase') + '">' + phase + '</span> ' +
        escapeHtml(text);
      logEl.appendChild(line);
      // keep the DOM bounded on a long or noisy startup
      while (logEl.childNodes.length > 300) logEl.removeChild(logEl.firstChild);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
      });
    }

    function go() {
      done = true;
      msgEl.textContent = 'Ready — opening ThinkStack';
      window.location.replace(BACKEND);
    }

    function fail(error, logPath, tail) {
      if (done) return;
      done = true;
      ringEl.className = 'ring stopped';
      msgEl.textContent = 'ThinkStack could not start';
      subEl.textContent = 'gave up after ' + secs() + 's';
      (tail || []).forEach(function (l) { log('log', l, 'err'); });
      document.getElementById('failMsg').textContent = error;
      document.getElementById('failPath').textContent = logPath
        ? 'Full log: ' + logPath
        : '';
      document.getElementById('fail').style.display = 'block';
      document.getElementById('actions').style.display = 'flex';
    }

    document.getElementById('retry').onclick = function () { window.location.reload(); };

    // ── primary path: the Rust shell narrates every step over Tauri events ──
    var tauri = window.__TAURI__;
    if (tauri && tauri.event) {
      tauri.event.listen('startup:step', function (e) {
        var p = e.payload || {};
        if (p.phase === 'backend') log('backend', p.detail, '');
        else {
          log(p.phase, p.detail);
          msgEl.textContent = p.detail;
        }
      });
      tauri.event.listen('startup:ready', go);
      tauri.event.listen('startup:failed', function (e) {
        var p = e.payload || {};
        fail(p.error || 'Unknown error', p.log_path, p.tail);
      });

      // Replay whatever happened before these listeners existed. Diagnosis
      // finishes in ~50ms, well before the webview attaches, so without this
      // the first and most useful lines never appear.
      if (tauri.core && tauri.core.invoke) {
        tauri.core.invoke('startup_log').then(function (steps) {
          (steps || []).forEach(function (s) {
            if (s.phase === 'backend') log('backend', s.detail, '');
            else { log(s.phase, s.detail); msgEl.textContent = s.detail; }
          });
        }).catch(function () {});
      }
    } else {
      // ── fallback: browser mode, no Tauri bridge. Poll, but with a real bound. ──
      log('init', 'No desktop bridge; polling ' + BACKEND);
      var MAX_MS = 180000;
      (function poll() {
        if (done) return;
        if (Date.now() - START > MAX_MS) {
          fail('The backend did not respond within 180s.', '', []);
          return;
        }
        fetch(BACKEND, { mode: 'no-cors', cache: 'no-store' })
          .then(go)
          .catch(function () {
            msgEl.textContent = 'Waiting for the local engine…';
            setTimeout(poll, 900);
          });
      })();
    }

    // If a backend is already up (e.g. after a Retry), skip straight to it.
    fetch(BACKEND, { mode: 'no-cors', cache: 'no-store' }).then(go).catch(function () {});
  </script>
</body>
</html>
