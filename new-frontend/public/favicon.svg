<!--
  The ThinkStack mark: three stacked layers, struck in ink on the paper stock.

  The same geometry as StackMark in src/components/marks.jsx, so the tab icon
  and the sidebar brand are one drawing rather than two that are free to drift.

  What was here before: a purple-and-cyan bolt behind fifteen feGaussianBlur
  filters, from neither this palette nor the one before it, and index.html
  never linked it -- so the app shipped with the browser's default page icon
  while carrying an unrelated logo it could not show.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <rect width="24" height="24" rx="1" fill="#EBE6DA"/>
  <g fill="none" stroke="#191712" stroke-width="2.1"
     stroke-linecap="round" stroke-linejoin="round"
     transform="translate(12 12) scale(0.82) translate(-12 -12)">
    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
    <path d="M2 17l10 5 10-5"/>
    <path d="M2 12l10 5 10-5"/>
  </g>
</svg>
